<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders | Velora Commerce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="topbar compact-topbar">
      <div class="container nav-wrap">
        <a href="/" class="brand">
          <span class="brand-mark">V</span>
          Velora
        </a>

        <nav class="nav-links">
          <a href="/">Home</a>
          <a href="/cart.html">Cart</a>
          <a href="/checkout.html">Checkout</a>
        </nav>

        <div class="nav-actions">
          <button id="authButton" class="ghost-btn">Login</button>
          <a href="/cart.html" class="cart-pill">
            <span>Cart</span>
            <span id="cartCount" class="cart-count">0</span>
          </a>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <div class="container orders-page">
        <div class="section-heading split-head">
          <div>
            <span class="eyebrow">Account</span>
            <h2>My orders</h2>
          </div>
          <a href="/" class="link-button">Shop more</a>
        </div>

        <div id="ordersLoading" class="loading-state hidden">Loading your order history...</div>
        <div id="ordersContainer" class="orders-container"></div>
      </div>
    </main>

    <div id="authModal" class="modal hidden" aria-hidden="true">
      <div class="modal-panel">
        <button class="close-modal" id="closeAuthModal" aria-label="Close authentication modal">×</button>
        <div class="auth-tabs">
          <button class="tab-btn active" data-auth-tab="login">Login</button>
          <button class="tab-btn" data-auth-tab="register">Register</button>
        </div>

        <form id="authForm" class="auth-form">
          <div id="registerNameWrap" class="field hidden">
            <label for="registerName">Full name</label>
            <input id="registerName" name="name" type="text" placeholder="Jane Smith" />
          </div>

          <div class="field">
            <label for="authEmail">Email</label>
            <input id="authEmail" name="email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="field">
            <label for="authPassword">Password</label>
            <input id="authPassword" name="password" type="password" placeholder="••••••••" required />
          </div>

          <button type="submit" class="primary-btn full-width" id="authSubmitBtn">Login</button>
          <p id="authMessage" class="auth-message"></p>
        </form>
      </div>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
